name: Publish
on:
  push:
    branches:
      - "main"
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write # push the version commit/tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing (OIDC): no npm token stored anywhere
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; don't rely on the runner's bundled npm.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run lint && pnpm run test
      # Opens/updates the "Version Packages" PR while changesets are pending;
      # once that PR is merged, builds and publishes to npm with provenance.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided by GitHub automatically
